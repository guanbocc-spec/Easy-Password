<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>Easy Password</title>
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="logo">🔐</span>
        <span>Easy Password</span>
      </div>
      <div class="header-right">
        <span id="lockTimer" class="timer" hidden></span>
        <button id="pinBtn" class="icon-btn" data-i18n-title="pin_title" hidden>📌</button>
        <button id="lockBtn" class="icon-btn" data-i18n="lock_btn" data-i18n-title="lock_btn_title" hidden>锁定</button>
        <span id="tag" class="tag" data-i18n="tag">非对称加密</span>
      </div>
    </header>

    <!-- 网站访问授权条（未授权时显示） -->
    <div id="permBar" class="perm-bar" hidden>
      <span class="perm-text" data-i18n="perm_desc"></span>
      <button id="permBtn" class="btn small" data-i18n="perm_grant">授权</button>
    </div>

    <!-- 视图 1：创建主账户 -->
    <section id="viewSetup" class="view" hidden>
      <h3 class="view-title" data-i18n="setup_title">创建主账户</h3>
      <p class="view-desc" data-i18n="setup_desc"></p>
      <input id="setupAccount" type="text" data-i18n-ph="ph_master_account" />
      <input id="setupPass" type="password" data-i18n-ph="ph_master_password" />
      <input id="setupPass2" type="password" data-i18n-ph="ph_confirm_master_password" />
      <button id="setupBtn" class="btn primary" data-i18n="setup_btn">创建并解锁</button>
    </section>

    <!-- 视图 2：解锁 -->
    <section id="viewUnlock" class="view" hidden>
      <h3 class="view-title" data-i18n="unlock_title">确认身份</h3>
      <p class="view-desc" data-i18n="unlock_desc"></p>
      <input id="unlockAccount" type="text" data-i18n-ph="ph_account" />
      <input id="unlockPass" type="password" data-i18n-ph="ph_password" />
      <button id="unlockBtn" class="btn primary" data-i18n="unlock_btn">解锁</button>
    </section>

    <!-- 视图 3：主界面（已解锁） -->
    <section id="viewMain" class="view" hidden>
      <!-- 待保存提示（图标角标点开后在此确认） -->
      <div id="saveBar" class="save-bar" hidden>
        <span id="saveBarText" class="save-bar-text"></span>
        <button id="saveBarSave" class="btn small" data-i18n="btn_save">保存</button>
        <button id="saveBarIgnore" class="btn small" data-i18n="btn_ignore">忽略</button>
      </div>

      <div class="tabbar">
        <button id="tabVault" class="tab active" data-i18n="tab_vault">密码库</button>
        <button id="tabBastion" class="tab" data-i18n="tab_bastion">堡垒机</button>
      </div>

      <div id="vaultPanel">
      <button id="addToggle" class="btn small add-toggle">＋ <span data-i18n="btn_toggle_add">新增账号</span></button>
      <div class="add" id="addSection" hidden>
        <div class="row">
          <input id="addDomain" type="text" data-i18n-ph="ph_domain" />
        </div>
        <div class="row">
          <input id="addUser" type="text" data-i18n-ph="ph_username" />
        </div>
        <div class="row">
          <input id="addPass" type="password" data-i18n-ph="ph_password2" />
          <button id="genPass" class="icon-btn" data-i18n-title="title_gen">🔑</button>
          <button id="togglePass" class="icon-btn" data-i18n-title="title_toggle">👁</button>
        </div>
        <div class="pw-strength" id="pwStrength" hidden>
          <div class="pw-bar"><div id="pwBarFill" class="pw-bar-fill"></div></div>
          <span id="pwLabel" class="pw-label"></span>
        </div>
        <div class="row">
          <input id="addNote" type="text" data-i18n-ph="ph_note" />
        </div>
        <div class="row">
          <input id="addGroup" type="text" list="groupList" data-i18n-ph="ph_group" />
        </div>
        <datalist id="groupList"></datalist>
        <div class="row">
          <input id="addFullUrl" type="text" data-i18n-ph="ph_fullurl" />
        </div>
        <button id="addBtn" class="btn primary" data-i18n="add_btn">加密并保存</button>
      </div>

      <div class="list-section">
        <div id="panelSite" class="panel-site" hidden></div>
        <div class="list-head">
          <input id="search" type="text" data-i18n-ph="ph_search" />
        </div>
        <div id="list" class="list"></div>
        <div id="empty" class="empty" data-i18n="empty_list">还没有保存任何账号</div>
      </div>

      <div class="settings">
        <div class="override">
          <div class="set-row"><span data-i18n="override_title">站点环境标记（优先级高于分组）</span></div>
          <div class="override-input">
            <input id="overrideHost" type="text" data-i18n-ph="ph_override_host" />
            <span class="group-colors">
              <button class="color-dot c-none" data-color="none"></button>
              <button class="color-dot c-red" data-color="red"></button>
              <button class="color-dot c-green" data-color="green"></button>
            </span>
          </div>
          <div id="overrideList" class="override-list"></div>
        </div>

        <button id="clearBrowserPM" class="btn small danger-btn" data-i18n="btn_disable_browser_pm">清除并禁用浏览器自带密码</button>
      </div>
      </div><!-- /vaultPanel -->

      <!-- 堡垒机记录器：从堡垒机 URL 识别目标机 IP+用户，过滤/新增该目标机凭据（无法回填，提供复制） -->
      <div id="bastionPanel" hidden>
        <div id="bastionContext"></div>
        <div class="bastion-hosts">
          <div class="set-row"><span data-i18n="bastion_hosts_title">堡垒机地址（可多个）</span></div>
          <div id="bastionList" class="override-list"></div>
          <div class="override-input">
            <input id="bastionHostInput" type="text" data-i18n-ph="ph_bastion_host" />
            <button id="bastionAddBtn" class="btn small" data-i18n="bastion_add">添加</button>
          </div>
          <button id="bastionSetCurrent" class="btn small" data-i18n="bastion_set_current">把当前站点设为堡垒机</button>
        </div>
      </div>

      <!-- 两个 Tab 共用：自动锁定 / 活动续期 / 备份 / 改主密码 -->
      <div class="common">
        <div class="set-row">
          <span data-i18n="setting_autolock">自动锁定</span>
          <select id="lockMinutes">
            <option value="5" data-i18n="opt_5min">5 分钟</option>
            <option value="15" data-i18n="opt_15min">15 分钟</option>
            <option value="30" data-i18n="opt_30min">30 分钟</option>
            <option value="60" data-i18n="opt_1hour">1 小时</option>
            <option value="120" data-i18n="opt_2hour">2 小时</option>
          </select>
        </div>
        <label class="set-row">
          <span data-i18n="setting_sliding">活动时自动续期</span>
          <input id="sliding" type="checkbox" />
        </label>
        <div class="set-kdf" id="kdfInfo"></div>
        <footer class="footer">
          <button id="exportBtn" class="btn small" data-i18n="export_btn">导出加密备份</button>
          <button id="importBtn" class="btn small" data-i18n="import_btn">导入备份</button>
          <button id="pwdBtn" class="btn small" data-i18n="pwd_btn">改主密码</button>
          <input id="importFile" type="file" accept="application/json" hidden />
        </footer>
      </div>
    </section>

    <!-- 视图 5：创建主账户后引导授权网站访问 -->
    <section id="viewPerm" class="view" hidden>
      <h3 class="view-title" data-i18n="perm_view_title">开启网页自动填充</h3>
      <p class="view-desc" data-i18n="perm_view_desc"></p>
      <button id="permGrantBtn" class="btn primary" data-i18n="perm_grant">授权</button>
      <button id="permSkipBtn" class="btn small" style="width: 100%; margin-top: 8px;" data-i18n="perm_skip">稍后再说</button>
    </section>

    <!-- 视图 4：修改主密码（一页提交） -->
    <section id="viewChange" class="view" hidden>
      <h3 class="view-title" data-i18n="change_title">修改主密码</h3>
      <p class="view-desc" data-i18n="change_desc"></p>
      <input id="curPass" type="password" data-i18n-ph="ph_cur_pass" />
      <input id="newPass" type="password" data-i18n-ph="ph_new_pass" />
      <input id="newPass2" type="password" data-i18n-ph="ph_new_pass2" />
      <button id="changeBtn" class="btn primary" data-i18n="change_btn">确认修改</button>
      <button id="changeCancelBtn" class="btn small" style="width: 100%; margin-top: 8px;" data-i18n="cancel_btn">取消</button>
    </section>

    <!-- 每周备份提醒（周一/本周未备份时弹出） -->
    <div id="backupModal" class="modal" hidden>
      <div class="modal-card">
        <div class="modal-title" data-i18n="backup_due_title">每周备份提醒</div>
        <div class="modal-text" data-i18n="backup_due_desc"></div>
        <button id="backupNowBtn" class="btn primary" data-i18n="backup_now">立即备份</button>
        <button id="backupLaterBtn" class="btn small" data-i18n="backup_later">稍后</button>
      </div>
    </div>

    <!-- 编辑条目备注 -->
    <div id="noteModal" class="modal" hidden>
      <div class="modal-card">
        <div class="modal-title" data-i18n="note_edit_title">编辑备注</div>
        <input id="noteInput" type="text" data-i18n-ph="ph_note" />
        <input id="noteGroupInput" type="text" list="groupList" data-i18n-ph="ph_group" />
        <button id="noteSaveBtn" class="btn primary" data-i18n="btn_save">保存</button>
        <button id="noteCancelBtn" class="btn small" data-i18n="cancel_btn">取消</button>
      </div>
    </div>

    <!-- 导入加密备份时输入主密码 -->
    <div id="importModal" class="modal" hidden>
      <div class="modal-card">
        <div class="modal-title" data-i18n="import_password_prompt">请输入该备份文件的主密码</div>
        <input id="importPass" type="password" data-i18n-ph="ph_password" />
        <button id="importConfirmBtn" class="btn primary" data-i18n="import_decrypt">解密并导入</button>
        <button id="importCancelBtn" class="btn small" data-i18n="cancel_btn">取消</button>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../src/generator.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
