<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>修改密码测试页 · Easy Password</title>
    <style>
      body { font-family: "Microsoft YaHei", sans-serif; background: #f6f8fa; display: flex; justify-content: center; padding-top: 60px; }
      .card { background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.08); width: 340px; }
      h2 { margin: 0 0 18px; }
      label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
      input { width: 100%; padding: 9px 10px; border: 1px solid #d0d7de; border-radius: 7px; box-sizing: border-box; }
      button { width: 100%; margin-top: 18px; padding: 10px; border: none; border-radius: 7px; background: #4f46e5; color: #fff; font-size: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <form class="card" onsubmit="event.preventDefault(); alert('已提交新密码（演示）');">
      <h2>修改密码</h2>
      <label>账号</label>
      <input name="username" type="text" autocomplete="username" placeholder="账号" />
      <label>新密码（聚焦此框会弹出强密码生成器）</label>
      <input name="newPassword" type="password" autocomplete="new-password" placeholder="新密码" />
      <label>确认新密码</label>
      <input name="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入" />
      <button type="submit">提交</button>
    </form>
  </body>
</html>
